user www-data;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1g;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream new_api_core {
        server new-api:3000;
        keepalive 32;
    }

    upstream companion_backend {
        server companion:8787;
        keepalive 8;
    }

    server {
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location = /healthz {
            proxy_pass http://companion_backend/healthz;
        }

        location ~ ^/(leaderboard|modelstatus)/api(?:/|$) {
            proxy_pass http://companion_backend;
        }

        location ~ ^/lottery/api(?:/|$) {
            proxy_pass http://new_api_core;
        }

        location ~ ^/(api|v1|v1beta|pg|mj|suno|kling|jimeng)(?:/|$) {
            proxy_pass http://new_api_core;
        }

        location ~ ^/[^/]+/mj(?:/|$) {
            proxy_pass http://new_api_core;
        }

        location ~ ^/dashboard/billing(?:/|$) {
            proxy_pass http://new_api_core;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
