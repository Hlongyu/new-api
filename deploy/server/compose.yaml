name: new-api

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  new-api:
    image: ${CORE_IMAGE:?CORE_IMAGE is required}
    container_name: new-api
    restart: unless-stopped
    command: ['--log-dir', '/app/logs']
    ports:
      - name: core-http
        target: 3000
        published: '3000'
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: /var/lib/new-api/data
        target: /data
      - type: bind
        source: /var/log/new-api
        target: /app/logs
    environment:
      SQL_DSN: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      TZ: ${TZ:-Asia/Shanghai}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      NODE_NAME: ${NODE_NAME:-new-api-node-1}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:?SESSION_COOKIE_TRUSTED_URL is required}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/api/status | grep -q ''"success":true''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend
      - code-internal

  web:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: new-api-web
    restart: unless-stopped
    read_only: true
    ports:
      - name: http
        target: 3000
        published: '3002'
        host_ip: 127.0.0.1
        protocol: tcp
    tmpfs:
      - /tmp:mode=1777
      - /var/lib/nginx:mode=0755
    depends_on:
      new-api:
        condition: service_healthy
      companion:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/api/status | grep -q ''"success":true'' && wget -q -O - http://127.0.0.1:3000/healthz | grep -q ''"service":"new-api-companion"''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  companion:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: new-api-companion
    restart: unless-stopped
    entrypoint: ['node']
    command: ['/opt/new-api/companion/src/server.js']
    user: '1000:1000'
    read_only: true
    ports:
      - name: companion-http
        target: 8787
        published: '8787'
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: volume
        source: leaderboard_data
        target: /app/data
    tmpfs:
      - /tmp:mode=1777
    environment:
      PORT: 8787
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      BASE_PATH: ${LEADERBOARD_BASE_PATH:-/leaderboard}
      MODEL_STATUS_BASE_PATH: ${MODEL_STATUS_BASE_PATH:-/modelstatus}
      LOTTERY_SITE_BASE_PATH: ${LOTTERY_SITE_BASE_PATH:-/lottery}
      PUBLIC_URL: ${COMPANION_PUBLIC_URL:?COMPANION_PUBLIC_URL is required}
      NEW_API_PUBLIC_URL: ${NEW_API_PUBLIC_URL:-}
      NEW_API_BASE_URL: http://new-api:3000
      NEW_API_ROOT_ACCESS_TOKEN: ${NEW_API_ROOT_ACCESS_TOKEN:?NEW_API_ROOT_ACCESS_TOKEN is required}
      NEW_API_ROOT_USER_ID: ${NEW_API_ROOT_USER_ID:?NEW_API_ROOT_USER_ID is required}
      NEW_API_REQUEST_TIMEOUT_MS: ${NEW_API_REQUEST_TIMEOUT_MS:-12000}
      NEW_API_QUOTA_PER_UNIT: ${NEW_API_QUOTA_PER_UNIT:-500000}
      LEADERBOARD_TIME_ZONE: ${LEADERBOARD_TIME_ZONE:-Asia/Shanghai}
      LEADERBOARD_SYNC_INTERVAL_MINUTES: ${LEADERBOARD_SYNC_INTERVAL_MINUTES:-5}
      LEADERBOARD_ALL_START_TIMESTAMP: ${LEADERBOARD_ALL_START_TIMESTAMP:-1}
      LEADERBOARD_EXCLUDED_USER_IDS: ${LEADERBOARD_EXCLUDED_USER_IDS:-}
      DATABASE_PATH: /app/data/leaderboard.db
      SPONSOR_MIN_AMOUNT: ${SPONSOR_MIN_AMOUNT:-1}
      SPONSOR_MAX_AMOUNT: ${SPONSOR_MAX_AMOUNT:-1000}
      SUPPORT_ACTIVITY_ACTIVE_DAYS: ${SUPPORT_ACTIVITY_ACTIVE_DAYS:-3}
      SUPPORT_ACTIVITY_START_TIMESTAMP: ${SUPPORT_ACTIVITY_START_TIMESTAMP:-1784217600}
      RANK_SYSTEM_START_TIMESTAMP: ${RANK_SYSTEM_START_TIMESTAMP:-1784304000}
      POSTPAID_SYNC_INTERVAL_SECONDS: ${POSTPAID_SYNC_INTERVAL_SECONDS:-30}
      LOTTERY_ENABLED: ${LOTTERY_ENABLED:-true}
      LOTTERY_PRIZES: ${LOTTERY_PRIZES:-}
      LOTTERY_FULFILLMENT_INTERVAL_SECONDS: ${LOTTERY_FULFILLMENT_INTERVAL_SECONDS:-15}
      LOTTERY_REDEMPTION_INTERVAL_SECONDS: ${LOTTERY_REDEMPTION_INTERVAL_SECONDS:-60}
      APP_GIT_COMMIT: ${APP_RELEASE_REVISION:-}
      APP_DEPLOYED_AT: ${APP_RELEASE_DEPLOYED_AT:-0}
    depends_on:
      new-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8787/healthz | grep -q ''"service":"new-api-companion"''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  postgres:
    image: postgres@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 60s
    logging: *default-logging
    networks:
      - backend

  redis:
    image: redis@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
    container_name: redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend

volumes:
  pg_data:
    name: new-api_pg_data
    external: true
  redis_data:
    name: new-api_redis_data
    external: true
  leaderboard_data:
    name: ${LEADERBOARD_DATA_VOLUME:-new-api-leaderboard_leaderboard-data}
    external: true

networks:
  backend:
    name: new-api_new-api-network
    external: true
  code-internal:
    external: true
