name: Custom Delivery

on:
  push:
    tags:
      - 'custom-v*'

env:
  CORE_IMAGE_NAME: ghcr.io/hlongyu/new-api-core
  APP_IMAGE_NAME: ghcr.io/hlongyu/new-api-app

jobs:
  publish:
    name: Publish immutable Core and App images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: custom-images-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve and validate release
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin custom/main:refs/remotes/origin/custom/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/custom/main

          printf '%s\n' "$RELEASE_TAG" > VERSION
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Core image metadata
        id: core_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.CORE_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=sha-${{ steps.release.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish Core image
        id: core_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.core_meta.outputs.tags }}
          labels: ${{ steps.core_meta.outputs.labels }}
          cache-from: type=gha,scope=custom-core-amd64
          cache-to: type=gha,mode=max,scope=custom-core-amd64
          provenance: mode=max
          sbom: true

      - name: Generate App image metadata
        id: app_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.APP_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=sha-${{ steps.release.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish App image
        id: app_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.app
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.app_meta.outputs.tags }}
          labels: ${{ steps.app_meta.outputs.labels }}
          cache-from: type=gha,scope=custom-app-amd64
          cache-to: type=gha,mode=max,scope=custom-app-amd64
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images
        env:
          APP_IMAGE_DIGEST: ${{ steps.app_build.outputs.digest }}
          CORE_IMAGE_DIGEST: ${{ steps.core_build.outputs.digest }}
        run: |
          cosign sign --yes "$CORE_IMAGE_NAME@$CORE_IMAGE_DIGEST"
          cosign sign --yes "$APP_IMAGE_NAME@$APP_IMAGE_DIGEST"

      - name: Write release manifest
        env:
          APP_IMAGE_DIGEST: ${{ steps.app_build.outputs.digest }}
          CORE_IMAGE_DIGEST: ${{ steps.core_build.outputs.digest }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$RELEASE_SHA" \
            --arg version "$RELEASE_TAG" \
            --arg core_image "$CORE_IMAGE_NAME@$CORE_IMAGE_DIGEST" \
            --arg app_image "$APP_IMAGE_NAME@$APP_IMAGE_DIGEST" \
            --arg built_at "$(date --utc --iso-8601=seconds)" \
            '{repository: $repository, commit: $commit, version: $version, core_image: $core_image, app_image: $app_image, built_at: $built_at}' \
            > release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.release.outputs.tag }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish summary
        env:
          APP_IMAGE_DIGEST: ${{ steps.app_build.outputs.digest }}
          CORE_IMAGE_DIGEST: ${{ steps.core_build.outputs.digest }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo '### Published custom release images'
            echo
            echo "- Version: \`$RELEASE_TAG\`"
            echo "- Core: \`$CORE_IMAGE_NAME@$CORE_IMAGE_DIGEST\`"
            echo "- App: \`$APP_IMAGE_NAME@$APP_IMAGE_DIGEST\`"
            echo '- Production deployment: not started'
          } >> "$GITHUB_STEP_SUMMARY"
